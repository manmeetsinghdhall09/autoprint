name: Build Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Download Portable SumatraPDF
      run: |
        Invoke-WebRequest -Uri 'https://github.com/sumatrapdfreader/sumatrapdf/releases/download/prerelease/SumatraPDF-prerelease-64.exe' -OutFile 'SumatraPDF.exe'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build Executable via PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "AutoPrintApp" --add-data "SumatraPDF.exe;." "main.py"
        
    - name: Upload Windows App Executable
      uses: actions/upload-artifact@v3
      with:
        name: AutoPrintApp-Windows
        path: dist/AutoPrintApp.exe
