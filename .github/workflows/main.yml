name: Build Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Download Portable SumatraPDF
      run: |
        Invoke-WebRequest -Uri 'https://www.sumatrapdfreader.org/dl/rel/3.6.1/SumatraPDF-3.6.1-64.zip' -OutFile 'SumatraPDF.zip'
        Expand-Archive -Path 'SumatraPDF.zip' -DestinationPath '.'
        Get-ChildItem -Filter "*SumatraPDF*.exe" | Rename-Item -NewName "SumatraPDF.exe"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build Executable via PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "AutoPrintApp" --add-data "SumatraPDF.exe;." "main.py"
        
    - name: Upload Windows App Executable
      uses: actions/upload-artifact@v4
      with:
        name: AutoPrintApp-Windows
        path: dist/AutoPrintApp.exe
